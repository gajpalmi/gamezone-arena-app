kind = "mobile"
previewPath = "/"
title = "GAMEZONE ARENA"
description = "A premium skill-based gaming platform for discovering mini-games, building a player profile, earning non-cash XP and coins, completing challenges, and competing on leaderboards."
version = "1.0.0"
id = "artifacts/gamezone-arena"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22735

[services.development]
run = "pnpm --filter @workspace/gamezone-arena run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gamezone-arena", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gamezone-arena", "run", "serve" ]

[services.env]
PORT = "22735"
BASE_PATH = "/"
